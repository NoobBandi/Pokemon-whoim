# Non-semantic, always-on Pikachu LoRA dataset.
# IMPORTANT: do NOT set class_tokens — captions are intentionally empty so the
# LoRA trains as an unconditional appearance shift. (shuffle_caption/keep_tokens
# are omitted: they do nothing with empty captions and shuffle_caption would
# also conflict with --cache_text_encoder_outputs.)
[general]
caption_extension = ".txt"
enable_bucket = true
min_bucket_reso = 256
max_bucket_reso = 1024
bucket_reso_steps = 64
bucket_no_upscale = false

[[datasets]]
resolution = 512
batch_size = 4

  [[datasets.subsets]]
  image_dir = "data/lora_training/image"
  num_repeats = 12
